<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balachou Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ==================== Design Tokens ==================== */
    :root {
      --bg-deep: #080b10;
      --bg-primary: #0d1117;
      --bg-secondary: #121820;
      --bg-tertiary: #1a2230;
      --bg-hover: #222e3d;
      --bg-active: #1a2f28;
      --border: #1e2a38;
      --border-bright: #2a3a4e;
      --text-primary: #e8edf4;
      --text-secondary: #7a8a9e;
      --text-muted: #4a5568;
      --accent: #33ffd3;
      --accent-glow: #33ffd340;
      --accent-dim: #33ffd315;
      --accent-warm: #ffd333;
      --danger: #ff6b6b;
      --success: #4ade80;
      --warning: #fbbf24;
      --lua-color: #5e6ad2;
      --toml-color: #9c6b30;
      --json-color: #e8a838;
      --folder-color: #58a6ff;
      --radius: 10px;
      --radius-lg: 16px;
      --sidebar-width: 320px;
      --header-height: 56px;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Space Mono', 'JetBrains Mono', 'Fira Code', monospace;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,.4);
      --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
      --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
    }

    /* ==================== Reset ==================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.6;
      overflow: hidden;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ==================== Keyframes ==================== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 4px var(--accent-glow); }
      50% { box-shadow: 0 0 16px var(--accent-glow); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }

    /* ==================== Layout ==================== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }
    .app::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--noise);
      pointer-events: none;
      z-index: 9998;
      opacity: .5;
    }

    /* ==================== Header ==================== */
    .header {
      height: var(--header-height);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      flex-shrink: 0;
      z-index: 100;
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    }

    .header .menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: var(--radius);
      transition: background .15s;
    }
    .header .menu-btn:hover { background: var(--bg-hover); }

    .logo {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      animation: fadeIn .4s ease;
    }
    .logo .logo-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      animation: cardFloat 3s ease-in-out infinite;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      animation: fadeIn .4s ease .1s both;
    }

    .spacer { flex: 1; }

    .actions {
      display: flex;
      gap: 8px;
      animation: fadeIn .4s ease .2s both;
    }

    /* ==================== Buttons ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border-bright);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-size: 12px;
      font-family: var(--font-sans);
      font-weight: 600;
      cursor: pointer;
      transition: all .2s ease;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }
    .btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
      border-color: var(--text-muted);
    }
    .btn:active { transform: scale(.96); }
    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }
    .btn.accent {
      background: linear-gradient(135deg, #33ffd310, #33ffd308);
      border-color: #33ffd360;
      color: var(--accent);
    }
    .btn.accent:hover {
      background: linear-gradient(135deg, #33ffd325, #33ffd315);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .btn .btn-icon { font-size: 14px; line-height: 1; }

    .proxy-switch {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      animation: fadeIn .4s ease .15s both;
    }
    .proxy-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .proxy-switch .track {
      width: 38px;
      height: 22px;
      border-radius: 999px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-bright);
      position: relative;
      transition: all .2s ease;
    }
    .proxy-switch .track::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all .2s ease;
    }
    .proxy-switch input:checked + .track {
      background: var(--accent-dim);
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .proxy-switch input:checked + .track::after {
      left: 19px;
      background: var(--accent);
    }
    .proxy-switch .switch-label { white-space: nowrap; }

    /* ==================== Body ==================== */
    .body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ==================== Sidebar ==================== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      animation: slideInLeft .3s ease;
    }

    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header .label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sidebar-header .count {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 1px 7px;
      border-radius: 10px;
      border: 1px solid #33ffd320;
    }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 0;
    }
    .tree-container::-webkit-scrollbar { width: 5px; }
    .tree-container::-webkit-scrollbar-track { background: transparent; }
    .tree-container::-webkit-scrollbar-thumb {
      background: var(--bg-hover);
      border-radius: 3px;
    }
    .tree-container::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Tree Nodes */
    .tree-node { user-select: none; }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      line-height: 28px;
      transition: all .15s ease;
      border-radius: 6px;
      margin: 1px 6px;
      position: relative;
    }
    .tree-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }
    .tree-item.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-left: 2px solid var(--accent);
    }
    .tree-item .icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tree-item .icon svg {
      width: 16px;
      height: 16px;
    }
    .tree-item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .tree-item .size {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity .15s;
    }
    .tree-item:hover .size,
    .tree-item.active .size { opacity: 1; }

    .tree-children {
      overflow: hidden;
      transition: max-height .25s cubic-bezier(.4,0,.2,1),
                  opacity .2s ease;
      max-height: 9999px;
      opacity: 1;
    }
    .tree-children.collapsed {
      max-height: 0 !important;
      opacity: 0;
    }

    .tree-toggle {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s cubic-bezier(.4,0,.2,1);
      color: var(--text-muted);
    }
    .tree-toggle svg { width: 10px; height: 10px; }
    .tree-toggle.expanded { transform: rotate(90deg); }

    /* ==================== Content Area ==================== */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      background: var(--bg-primary);
      position: relative;
    }

    .content-header {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      animation: fadeIn .2s ease;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      min-width: 0;
      overflow: hidden;
    }
    .breadcrumb span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .breadcrumb .crumb-file {
      color: var(--text-primary);
      font-weight: 700;
    }
    .breadcrumb .sep {
      color: var(--text-muted);
      flex-shrink: 0;
      margin: 0 2px;
      opacity: .5;
    }

    .content-header .spacer { flex: 1; }

    .file-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ==================== Preview Wrapper ==================== */
    .preview-wrapper {
      flex: 1;
      overflow: auto;
      position: relative;
    }
    .preview-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
    .preview-wrapper::-webkit-scrollbar-track { background: var(--bg-primary); }
    .preview-wrapper::-webkit-scrollbar-thumb {
      background: var(--bg-hover);
      border-radius: 4px;
    }

    /* ==================== Welcome Screen ==================== */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }
    .welcome::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 500px;
      height: 500px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: .3;
      pointer-events: none;
    }

    .welcome .card-group {
      position: relative;
      width: 120px;
      height: 100px;
      margin-bottom: 28px;
      animation: fadeIn .6s ease;
    }
    .welcome .card {
      position: absolute;
      width: 60px;
      height: 84px;
      border-radius: 8px;
      border: 2px solid var(--border-bright);
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-md);
    }
    .welcome .card:nth-child(1) {
      left: 0; top: 8px;
      transform: rotate(-8deg);
      animation: cardFloat 4s ease-in-out infinite;
    }
    .welcome .card:nth-child(2) {
      left: 30px; top: 0;
      transform: rotate(2deg);
      z-index: 1;
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow), var(--shadow-md);
      animation: cardFloat 4s ease-in-out infinite .5s;
    }
    .welcome .card:nth-child(3) {
      left: 55px; top: 10px;
      transform: rotate(10deg);
      animation: cardFloat 4s ease-in-out infinite 1s;
    }

    .welcome h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      animation: fadeIn .5s ease .1s both;
      letter-spacing: -0.5px;
    }
    .welcome p {
      font-size: 14px;
      max-width: 420px;
      color: var(--text-secondary);
      line-height: 1.7;
      animation: fadeIn .5s ease .2s both;
    }

    .welcome .stats {
      display: flex;
      gap: 32px;
      margin-top: 32px;
      animation: fadeIn .5s ease .3s both;
    }
    .welcome .stat {
      text-align: center;
      padding: 16px 24px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      min-width: 100px;
    }
    .welcome .stat .num {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--font-mono);
      line-height: 1.2;
    }
    .welcome .stat .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      margin-top: 4px;
    }

    /* ==================== Code Preview ==================== */
    .code-preview {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.75;
      tab-size: 2;
      counter-reset: line;
      animation: fadeIn .2s ease;
    }
    .code-preview pre {
      margin: 0 !important;
      padding: 0 !important;
      background: var(--bg-primary) !important;
      border-radius: 0 !important;
      overflow-x: auto;
    }
    .code-preview code {
      font-family: var(--font-mono) !important;
      font-size: 13px !important;
      display: block;
      padding: 16px 0;
    }
    .code-preview .line {
      display: flex;
      padding: 0 20px 0 0;
      transition: background .1s;
    }
    .code-preview .line:hover {
      background: var(--bg-tertiary);
    }
    .code-preview .line-num {
      display: inline-block;
      width: 52px;
      flex-shrink: 0;
      text-align: right;
      padding-right: 16px;
      color: var(--text-muted);
      user-select: none;
      font-size: 12px;
      opacity: .6;
      border-right: 1px solid var(--border);
      margin-right: 16px;
    }
    .code-preview .line-content {
      flex: 1;
      min-width: 0;
      white-space: pre;
    }

    /* ==================== Syntax Theme (Custom) ==================== */
    .token.comment,
    .token.prolog,
    .token.doctype,
    .token.cdata { color: #546178; font-style: italic; }
    .token.punctuation { color: #7a8a9e; }
    .token.property,
    .token.tag,
    .token.boolean,
    .token.number,
    .token.constant { color: #ff9e64; }
    .token.selector,
    .token.attr-name,
    .token.string,
    .token.char,
    .token.builtin { color: #9ece6a; }
    .token.operator,
    .token.entity,
    .token.url { color: #89ddff; }
    .token.atrule,
    .token.attr-value,
    .token.keyword { color: #bb9af7; }
    .token.function,
    .token.class-name { color: #7aa2f7; }
    .token.regex,
    .token.important,
    .token.variable { color: #e0af68; }
    .token.deleted { color: #f7768e; }
    .token.inserted { color: #9ece6a; }

    /* ==================== States ==================== */
    .state-message {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: var(--text-secondary);
    }
    .state-message .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border-bright);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .state-message.error .icon { color: var(--danger); font-size: 32px; }
    .state-message .msg {
      font-size: 13px;
      font-weight: 500;
    }

    /* ==================== Toast ==================== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-bright);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      z-index: 99999;
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.visible { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); }
    .toast.success::before { content: '\2713'; color: var(--success); }
    .toast.error { border-color: var(--danger); }
    .toast.error::before { content: '\2717'; color: var(--danger); }

    /* ==================== Progress Bar ==================== */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-warm));
      z-index: 10000;
      transition: width .3s ease;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ==================== Mobile Overlay ==================== */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      z-index: 50;
      opacity: 0;
      transition: opacity .25s;
    }
    .sidebar-overlay.open {
      display: block;
      opacity: 1;
    }

    /* ==================== Settings Dialog ==================== */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: flex-start;
      justify-content: flex-end;
      padding: calc(var(--header-height) + 12px) 18px 18px;
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(3px);
    }
    .dialog-backdrop.open { display: flex; }
    .settings-dialog {
      width: min(360px, calc(100vw - 36px));
      background: linear-gradient(180deg, var(--bg-secondary), var(--bg-primary));
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg), 0 0 28px var(--accent-dim);
      overflow: hidden;
      animation: fadeIn .18s ease;
    }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .settings-header h3 {
      font-size: 14px;
      letter-spacing: .2px;
    }
    .settings-body {
      padding: 8px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border-radius: var(--radius);
    }
    .settings-row:hover { background: var(--bg-tertiary); }
    .settings-row .title {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 700;
    }
    .settings-row .desc {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 2px;
    }
    @media (max-width: 768px) {
      .header .menu-btn { display: flex; }
      .subtitle { display: none; }

      .sidebar {
        position: fixed;
        top: var(--header-height);
        left: 0;
        bottom: 0;
        z-index: 60;
        transform: translateX(-100%);
        transition: transform .3s cubic-bezier(.4,0,.2,1);
        width: 280px;
        box-shadow: var(--shadow-lg);
      }
      .sidebar.open { transform: translateX(0); }

</head>

  <!-- ==================== External Libraries ==================== -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <script>
  (function() {
    'use strict';

    // ==================== Constants ====================
    const GITHUB_TREE_API = 'https://api.github.com/repos/ChromaPIE/Balachou/git/trees/main?recursive=1';
    const MANIFEST_URL = 'repo-tree.json';
    const JSDELIVR_RAW_BASE = 'https://cdn.jsdelivr.net/gh/ChromaPIE/Balachou@main';
    const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/ChromaPIE/Balachou/main';
    const PROXY_PREFIX = 'https://gh-proxy.org/';
    const BALACHOU_SETTINGS_KEY = 'balachouHubSettings';
    const DEFAULT_SETTINGS = { hideEnglishFiles: false, hideInternalFiles: true };
    let useProxy = true;

    // Latest known snapshot — only used when jsDelivr file index is unavailable.
    const REPO_TREE = [
      { p: '.gitattributes', t: 'f', s: 66 },
      { p: 'LICENSE', t: 'f', s: 1066 },
      { p: 'Mods/All-In-Jest/localization/default.lua', t: 'f', s: 196115 },
      { p: 'Mods/All-In-Jest/localization/en-us.lua', t: 'f', s: 265 },
      { p: 'Mods/All-In-Jest/localization/zh_CN.lua', t: 'f', s: 187197 },
      { p: 'Mods/ArtBox/localization/en-us.lua', t: 'f', s: 27339 },
      { p: 'Mods/ArtBox/localization/zh_CN.lua', t: 'f', s: 25301 },
      { p: 'Mods/ChromicPatch/localization/zh_CN.lua', t: 'f', s: 2627 },
      { p: 'Mods/ChromicPatch/lovely/patches.toml', t: 'f', s: 17160 },
      { p: 'Mods/ChromicPatch/lovely/patches_last.toml', t: 'f', s: 1114 },
      { p: 'Mods/ChromicPatch/lovely/zhcn_patch.toml', t: 'f', s: 3314 },
      { p: 'Mods/ChromicPatch/main.lua', t: 'f', s: 0 },
      { p: 'Mods/ChromicPatch/metadata.json', t: 'f', s: 348 },
      { p: 'Mods/SealsOnEverything/localization/en-us.lua', t: 'f', s: 42111 },
      { p: 'Mods/SealsOnEverything/localization/zh_CN.lua', t: 'f', s: 41347 },
      { p: 'Mods/reverie/localization/en-us.lua', t: 'f', s: 21152 },
      { p: 'Mods/reverie/localization/zh_CN.lua', t: 'f', s: 20999 },
      { p: 'Mods/smods/localization/en-us.lua', t: 'f', s: 12526 },
      { p: 'Mods/smods/localization/zh_CN.lua', t: 'f', s: 12733 },
      { p: 'localization/zh_CN.lua', t: 'f', s: 142444 },
    ];

    // ==================== State ====================
    let treeData = null;
    let visibleTreeData = null;
    let activeFile = null;
    let currentContent = null;
    let pendingHashPath = null;
    let settings = loadSettings();

    // ==================== DOM Refs ====================
    const $ = id => document.getElementById(id);
    const treeContainer = $('treeContainer');
    const previewWrapper = $('previewWrapper');
    const welcomeScreen = $('welcomeScreen');
    const contentHeader = $('contentHeader');
    const breadcrumb = $('breadcrumb');
    const btnCopy = $('btnCopy');
    const btnDownload = $('btnDownload');
    const btnDownloadAll = $('btnDownloadAll');
    const btnRefresh = $('btnRefresh');
    const btnSettings = $('btnSettings');
    const btnCloseSettings = $('btnCloseSettings');
    const settingsDialog = $('settingsDialog');
    const settingHideEnglish = $('settingHideEnglish');
    const settingHideInternal = $('settingHideInternal');
    const menuBtn = $('menuBtn');
    const sidebar = $('sidebar');
    const sidebarOverlay = $('sidebarOverlay');
    const toastEl = $('toast');
    const progressBar = $('progressBar');
    const statsArea = $('statsArea');
    const fileCount = $('fileCount');
    const proxySwitch = $('proxySwitch');

    // ==================== SVG Icons ====================
    const ICONS = {
      folder: '<svg viewBox="0 0 16 16" fill="#58a6ff"><path d="M1.75 1A1.75 1.75 0 000 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0016 13.25v-8.5A1.75 1.75 0 0014.25 3H7.5a.25.25 0 01-.2-.1l-.9-1.2A1.75 1.75 0 005.05 1H1.75z"/></svg>',
      folderOpen: '<svg viewBox="0 0 16 16" fill="#58a6ff"><path d="M.513 1.513A1.75 1.75 0 011.75 1h3.5c.55 0 1.07.26 1.4.7l.9 1.2a.25.25 0 00.2.1h6.5A1.75 1.75 0 0116 4.75v8.5A1.75 1.75 0 0114.25 15H1.75A1.75 1.75 0 010 13.25V2.75c0-.464.184-.91.513-1.237z"/></svg>',
      lua: '<svg viewBox="0 0 16 16" fill="#5e6ad2"><circle cx="8" cy="8" r="7"/><circle cx="8" cy="8" r="3" fill="#0d1117"/><circle cx="8" cy="5" r="1.2" fill="#0d1117"/></svg>',
      toml: '<svg viewBox="0 0 16 16" fill="#9c6b30"><rect x="2" y="1" width="12" height="14" rx="2"/><line x1="5" y1="5" x2="11" y2="5" stroke="#0d1117" stroke-width="1.2"/><line x1="5" y1="8" x2="11" y2="8" stroke="#0d1117" stroke-width="1.2"/><line x1="5" y1="11" x2="9" y2="11" stroke="#0d1117" stroke-width="1.2"/></svg>',
      json: '<svg viewBox="0 0 16 16" fill="#e8a838"><path d="M4 2C2.9 2 2 2.9 2 4v2.5c0 .8-.7 1.5-1.5 1.5S-1 7.3-1 6.5V6a1 1 0 10-2 0v1.5C-3 8.9-1.6 10 .5 10S4 8.9 4 7.5V4h2v9.5c0 .8-.7 1.5-1.5 1.5h-1a1 1 0 100 2h1C6.5 17 8 15.5 8 13.5V2H4z"/><path d="M12 2c1.1 0 2 .9 2 2v2.5c0 .8.7 1.5 1.5 1.5s1.5-.7 1.5-1.5V6a1 1 0 112 0v1.5c0 1.4-1.4 2.5-3.5 2.5S12 8.9 12 7.5V4h-2v9.5c0 .8.7 1.5 1.5 1.5h1a1 1 0 110 2h-1C9.5 17 8 15.5 8 13.5V2h4z"/></svg>',
      file: '<svg viewBox="0 0 16 16" fill="#4a5568"><path d="M3.75 1.5a.25.25 0 00-.25.25v12.5c0 .138.112.25.25.25h8.5a.25.25 0 00.25-.25V4.664a.25.25 0 00-.073-.177l-2.914-2.914a.25.25 0 00-.177-.073H3.75z"/><path d="M10.5 1.5v2.75a.25.25 0 00.25.25h2.75L10.5 1.5z" fill="#7a8a9e"/></svg>',
      chevron: '<svg viewBox="0 0 10 10" fill="currentColor"><path d="M3 1l4 4-4 4"/></svg>'
    };

    // ==================== Toast ====================
    let toastTimer = null;
    function toast(msg, type = '') {
      clearTimeout(toastTimer);
      toastEl.textContent = msg;
      toastEl.className = 'toast' + (type ? ' ' + type : '');
      requestAnimationFrame(() => toastEl.classList.add('visible'));
      toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2500);
    }

    // ==================== Progress ====================
    function showProgress(pct) { progressBar.style.width = pct + '%'; }
    function hideProgress() { progressBar.style.width = '0'; }

    // ==================== Fetch ====================
    async function fetchJSON(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.json();
    }

    async function fetchText(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return resp.text();
    }

    function proxyRawUrl(path) {
      return `${PROXY_PREFIX}${GITHUB_RAW_BASE}/${path}`;
    }

    function cdnRawUrl(path) {
      return `${JSDELIVR_RAW_BASE}/${path}`;
    }

    async function fetchFileText(path) {
      const urls = useProxy
        ? [proxyRawUrl(path), cdnRawUrl(path)]
        : [cdnRawUrl(path), proxyRawUrl(path)];

      let lastError;
      for (const url of urls) {
        try {
          return await fetchText(url);
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError;
    }

    // ==================== Tree Data ====================
    async function loadTree() {
      showProgress(30);
      let items = REPO_TREE;

      try {
        items = await fetchLiveTree();
      } catch (e) {
        toast('无法获取最新目录，使用内置快照', 'error');
      }

      showProgress(80);
      treeData = buildTreeFromStatic(items);
      applyTreeSettings();
      openFileFromHash();
      showProgress(100);
      hideProgress();
    }

    async function fetchLiveTree() {
      const errors = [];

      try {
        return await fetchManifestTree();
      } catch (e) {
        errors.push(e);
      }

      try {
        const files = await fetchGithubTree();
        toast('站点目录清单不可用，尝试 GitHub 目录接口', 'error');
        return files;
      } catch (e) {
        errors.push(e);
      }

      throw errors[errors.length - 1];
    }

    async function fetchManifestTree() {
      const files = await fetchJSON(MANIFEST_URL);
      if (!Array.isArray(files) || !files.length) throw new Error('repo-tree.json is empty');
      return files;
    }

    async function fetchGithubTree() {
      const data = await fetchJSON(GITHUB_TREE_API);
      const files = data.tree
        .filter(item => item.type === 'blob')
        .map(item => ({ p: item.path, t: 'f', s: item.size || 0 }));
      if (!files.length) throw new Error('GitHub tree is empty');
      return files;
    }

    function buildTreeFromStatic(items) {
      const root = [];
      const dirMap = {};

      for (const item of [...items].sort((a, b) => a.p.localeCompare(b.p))) {
        const parts = item.p.split('/');
        const name = parts[parts.length - 1];
        const isDir = item.t === 'd';
        const filePath = item.p;

        // Ensure parent directories exist
        for (let depth = 1; depth < parts.length; depth++) {
          const dirPath = parts.slice(0, depth).join('/');
          if (!dirMap[dirPath]) {
            const dirNode = { name: parts[depth - 1], path: dirPath, type: 'dir', children: [] };
            dirMap[dirPath] = dirNode;
            if (depth === 1) {
              root.push(dirNode);
            } else {
              const parentPath = parts.slice(0, depth - 1).join('/');
              if (dirMap[parentPath]) {
                dirMap[parentPath].children.push(dirNode);
              }
            }
          }
        }

        if (isDir) {
          // Already created above
        } else {
          const node = { name, path: filePath, type: 'file', size: item.s };
          if (parts.length === 1) {
            root.push(node);
          } else {
            const parentPath = parts.slice(0, -1).join('/');
            if (dirMap[parentPath]) {
              dirMap[parentPath].children.push(node);
            }
          }
        }
      }

      return root;
    }

    // ==================== Stats ====================
    function updateStats(nodes) {
      let files = 0, totalSize = 0;
      function walk(list) {
        for (const n of list) {
          if (n.type === 'dir') walk(n.children);
          else { files++; totalSize += n.size || 0; }
        }
      }
      walk(nodes);
      fileCount.textContent = files;
      statsArea.innerHTML = `
        <div class="stat"><div class="num">${files}</div><div class="label">Files</div></div>
        <div class="stat"><div class="num">${nodes.length}</div><div class="label">Mods</div></div>
        <div class="stat"><div class="num">${formatSize(totalSize)}</div><div class="label">Total</div></div>
      `;
    }

    // ==================== Settings ====================
    function loadSettings() {
      try {
        return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(BALACHOU_SETTINGS_KEY) || '{}') };
      } catch {
        return { ...DEFAULT_SETTINGS };
      }
    }

    function saveSettings() {
      localStorage.setItem(BALACHOU_SETTINGS_KEY, JSON.stringify(settings));
    }

    function syncSettingsControls() {
      settingHideEnglish.checked = settings.hideEnglishFiles;
      settingHideInternal.checked = settings.hideInternalFiles;
    }

    function shouldHideFile(path) {
      const name = path.split('/').pop().toLowerCase();
      if (settings.hideEnglishFiles && /^en[-_]us\.lua$/i.test(name)) return true;
      if (settings.hideInternalFiles) {
        return path === '.gitattributes' || path === 'LICENSE' || path.startsWith('.github/');
      }
      return false;
    }

    function filterTreeBySettings(nodes) {
      const result = [];
      for (const node of nodes) {
        if (node.type === 'dir') {
          const children = filterTreeBySettings(node.children);
          if (children.length) result.push({ ...node, children });
        } else if (!shouldHideFile(node.path)) {
          result.push(node);
        }
      }
      return result;
    }

    function applyTreeSettings() {
      if (!treeData) return;
      visibleTreeData = filterTreeBySettings(treeData);
      renderTree(visibleTreeData);
      updateStats(visibleTreeData);
      if (activeFile && shouldHideFile(activeFile.path)) {
        clearActiveFile();
        toast('当前文件已被设置隐藏', 'error');
      }
      if (pendingHashPath) openFileFromHash();
    }

    function clearActiveFile() {
      activeFile = null;
      currentContent = null;
      contentHeader.style.display = 'none';
      previewWrapper.innerHTML = '';
      previewWrapper.appendChild(welcomeScreen);
      welcomeScreen.style.display = '';
    }

    function renderTree(nodes) {
      treeContainer.innerHTML = '';
      nodes.forEach((node, i) => {
        const el = buildTreeNode(node, 0);
        el.style.animation = `fadeIn .25s ease ${i * 40}ms both`;
        treeContainer.appendChild(el);
      });
    }

    function buildTreeNode(node, depth) {
      const el = document.createElement('div');
      el.className = 'tree-node';

      const item = document.createElement('div');
      item.className = 'tree-item';
      item.style.paddingLeft = (14 + depth * 18) + 'px';

      if (node.type === 'dir') {
        const toggle = document.createElement('span');
        toggle.className = 'tree-toggle expanded';
        toggle.innerHTML = ICONS.chevron;
        item.appendChild(toggle);

        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.innerHTML = ICONS.folderOpen;
        item.appendChild(icon);

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = node.name;
        item.appendChild(name);

        const children = document.createElement('div');
        children.className = 'tree-children';
        for (const child of node.children) {
          children.appendChild(buildTreeNode(child, depth + 1));
        }

        // Top-level expanded, deeper collapsed — CSS handles max-height via class
        if (depth > 0) {
          children.classList.add('collapsed');
          toggle.classList.remove('expanded');
        }

        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const collapsed = children.classList.toggle('collapsed');
          toggle.classList.toggle('expanded', !collapsed);
          icon.innerHTML = collapsed ? ICONS.folder : ICONS.folderOpen;
        });

        el.appendChild(item);
        el.appendChild(children);
      } else {
        const spacer = document.createElement('span');
        spacer.style.width = '14px';
        spacer.style.flexShrink = '0';
        item.appendChild(spacer);

        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.innerHTML = fileIconSVG(node.name);
        item.appendChild(icon);

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = node.name;
        item.appendChild(name);

        if (node.size != null) {
          const size = document.createElement('span');
          size.className = 'size';
          size.textContent = formatSize(node.size);
          item.appendChild(size);
        }

        item.dataset.path = node.path;
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          openFile(node, item, true);
        });
        el.appendChild(item);
      }

      return el;
    }

    // ==================== Deep Links ====================
    function filePathToHash(path) {
      return '#/file/' + encodeURIComponent(path);
    }

    function hashToFilePath() {
      const prefix = '#/file/';
      if (!location.hash.startsWith(prefix)) return null;
      try { return decodeURIComponent(location.hash.slice(prefix.length)); }
      catch { return null; }
    }

    function setFileHash(path) {
      const next = filePathToHash(path);
      if (location.hash !== next) history.replaceState(null, '', next);
    }

    function findFileNode(nodes, path) {
      for (const node of nodes || []) {
        if (node.type === 'dir') {
          const found = findFileNode(node.children, path);
          if (found) return found;
        } else if (node.path === path) {
          return node;
        }
      }
      return null;
    }

    function openFileFromHash() {
      const path = hashToFilePath();
      if (!path) return;
      const node = findFileNode(visibleTreeData, path);
      if (!node) {
        pendingHashPath = path;
        toast('链接指向的文件不存在或已被隐藏', 'error');
        return;
      }
      pendingHashPath = null;
      openFile(node);
    }

    function fileIconSVG(name) {
      const ext = name.split('.').pop().toLowerCase();
      return ICONS[ext] || ICONS.file;
    }

    // ==================== Open File ====================
    async function openFile(node, itemEl, updateHash = false) {
      activeFile = node;
      currentContent = null;
      if (updateHash) setFileHash(node.path);

      document.querySelectorAll('.tree-item.active').forEach(el => el.classList.remove('active'));
      const activeItem = itemEl || Array.from(document.querySelectorAll('.tree-item[data-path]'))
        .find(el => el.dataset.path === node.path);
      if (activeItem) activeItem.classList.add('active');

      contentHeader.style.display = 'flex';
      const parts = node.path.split('/');
      breadcrumb.innerHTML = parts.map((p, i) =>
        `<span${i === parts.length - 1 ? ' class="crumb-file"' : ''}>${p}</span>${i < parts.length - 1 ? '<span class="sep">/</span>' : ''}`
      ).join('');

      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('open');

      previewWrapper.innerHTML = `<div class="state-message">
        <div class="spinner"></div>
        <span class="msg">加载 ${node.name}...</span>
      </div>`;

      try {
        const text = await fetchFileText(node.path);
        currentContent = text;
        renderPreview(node, text);
      } catch (e) {
        previewWrapper.innerHTML = `<div class="state-message error">
          <div class="icon">&#9888;</div>
          <span class="msg">加载失败：${e.message}</span>
        </div>`;
      }
    }

    // ==================== Render Preview ====================
    function renderPreview(node, content) {
      const ext = node.name.split('.').pop().toLowerCase();
      if (ext === 'json') {
        renderJSON(content);
      } else if (['lua', 'toml', 'md'].includes(ext)) {
        renderCode(content, ext);
      } else {
        renderPlainText(content);
      }
    }

    function renderCode(content, lang) {
      const grammar = Prism.languages[lang] || Prism.languages.plain;
      const lines = content.split('\n');
      const highlighted = Prism.highlight(content, grammar, lang);
      const highlightedLines = highlighted.split('\n');

      let html = '<div class="code-preview"><pre><code>';
      for (let i = 0; i < highlightedLines.length; i++) {
        html += `<div class="line"><span class="line-num">${i + 1}</span><span class="line-content">${highlightedLines[i] || ' '}</span></div>`;
      }
      html += '</code></pre></div>';
      previewWrapper.innerHTML = html;
    }

    function renderJSON(content) {
      let formatted;
      try { formatted = JSON.stringify(JSON.parse(content), null, 2); }
      catch { formatted = content; }

      const highlighted = Prism.highlight(formatted, Prism.languages.json, 'json');
      const highlightedLines = highlighted.split('\n');

      let html = '<div class="code-preview"><pre><code>';
      for (let i = 0; i < highlightedLines.length; i++) {
        html += `<div class="line"><span class="line-num">${i + 1}</span><span class="line-content">${highlightedLines[i] || ' '}</span></div>`;
      }
      html += '</code></pre></div>';
      previewWrapper.innerHTML = html;
    }

    function renderPlainText(content) {
      const lines = content.split('\n');
      let html = '<div class="code-preview"><pre><code>';
      for (let i = 0; i < lines.length; i++) {
        const escaped = lines[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        html += `<div class="line"><span class="line-num">${i + 1}</span><span class="line-content">${escaped || ' '}</span></div>`;
      }
      html += '</code></pre></div>';
      previewWrapper.innerHTML = html;
    }

    // ==================== Copy ====================
    btnCopy.addEventListener('click', async () => {
      if (!currentContent) return;
      try {
        await navigator.clipboard.writeText(currentContent);
        toast('已复制到剪贴板', 'success');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = currentContent;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        toast('已复制到剪贴板', 'success');
      }
    });

    // ==================== Download Single ====================
    btnDownload.addEventListener('click', () => {
      if (!activeFile || !currentContent) return;
      downloadBlob(currentContent, activeFile.name);
      toast('下载已开始', 'success');
    });

    function downloadBlob(content, filename) {
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    // ==================== Download All (ZIP) ====================
    btnDownloadAll.addEventListener('click', async () => {
      if (!treeData) return;
      btnDownloadAll.disabled = true;
      btnDownloadAll.innerHTML = '<span class="btn-icon">&#8987;</span> 打包中...';
      showProgress(0);

      try {
        const zip = new JSZip();
        let done = 0;
        const allFiles = [];
        collectFiles(visibleTreeData || treeData, '', allFiles);
        const total = allFiles.length;

        for (const f of allFiles) {
          try {
            const text = await fetchFileText(f.path);
            zip.file(f.path, text);
          } catch {
            zip.file(f.path + '.error', 'Download failed');
          }
          done++;
          showProgress(Math.round(done / total * 100));
        }

        const blob = await zip.generateAsync({ type: 'blob' });
        saveAs(blob, 'Balachou-main.zip');
        toast('ZIP 下载已开始', 'success');
      } catch (e) {
        toast('打包失败：' + e.message, 'error');
      }

      hideProgress();
      btnDownloadAll.disabled = false;
      btnDownloadAll.innerHTML = '<span class="btn-icon">&#8615;</span> 下载 ZIP';
    });

    function collectFiles(nodes, prefix, result) {
      for (const n of nodes) {
        if (n.type === 'dir') collectFiles(n.children, prefix + n.name + '/', result);
        else result.push({ path: prefix + n.name });
      }
    }

    // ==================== Settings Dialog ====================
    function openSettingsDialog() {
      syncSettingsControls();
      settingsDialog.classList.add('open');
      settingsDialog.setAttribute('aria-hidden', 'false');
    }

    function closeSettingsDialog() {
      settingsDialog.classList.remove('open');
      settingsDialog.setAttribute('aria-hidden', 'true');
    }

    btnSettings.addEventListener('click', openSettingsDialog);
    btnCloseSettings.addEventListener('click', closeSettingsDialog);
    settingsDialog.addEventListener('click', (e) => {
      if (e.target === settingsDialog) closeSettingsDialog();
    });
    settingHideEnglish.addEventListener('change', () => {
      settings.hideEnglishFiles = settingHideEnglish.checked;
      saveSettings();
      applyTreeSettings();
    });
    settingHideInternal.addEventListener('change', () => {
      settings.hideInternalFiles = settingHideInternal.checked;
      saveSettings();
      applyTreeSettings();
    });

    window.addEventListener('hashchange', openFileFromHash);

    // ==================== Mobile Sidebar ====================
    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      sidebarOverlay.classList.toggle('open');
    });
    sidebarOverlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('open');
    });

    // ==================== Proxy Toggle ====================
    proxySwitch.addEventListener('change', () => {
      useProxy = proxySwitch.checked;
      const fileToReload = activeFile;
      currentContent = null;

      if (fileToReload) {
        openFile(fileToReload);
        return;
      }

      treeData = null;
      contentHeader.style.display = 'none';
      previewWrapper.innerHTML = '';
      previewWrapper.appendChild(welcomeScreen);
      welcomeScreen.style.display = '';
      statsArea.innerHTML = '';
      fileCount.textContent = '--';
      loadTree();
    });

    // ==================== Refresh ====================
    btnRefresh.addEventListener('click', () => {
      treeData = null; activeFile = null; currentContent = null;
      contentHeader.style.display = 'none';
      previewWrapper.innerHTML = '';
      previewWrapper.appendChild(welcomeScreen);
      welcomeScreen.style.display = '';
      statsArea.innerHTML = '';
      fileCount.textContent = '--';
      loadTree();
    });

    // ==================== Helpers ====================
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    // ==================== Keyboard Shortcuts ====================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSettingsDialog();
      if ((e.ctrlKey || e.metaKey) && e.key === 'c' && !window.getSelection().toString()) {
        if (currentContent) {
          e.preventDefault();
          btnCopy.click();
        }
      }
    });

    // ==================== Init ====================
    loadTree();

  })();
  </script>
</body>
</html>
