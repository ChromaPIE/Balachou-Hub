name: Purge jsDelivr cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    name: Purge directory cache
    runs-on: ubuntu-latest

    steps:
      - name: Purge jsDelivr directory endpoints
        shell: bash
        run: |
          set -u

          urls=(
            "https://data.jsdelivr.com/v1/package/gh/ChromaPIE/Balachou-Hub@main/flat"
            "https://cdn.jsdelivr.net/gh/ChromaPIE/Balachou-Hub@main/"
          )

          for url in "${urls[@]}"; do
            purge_url="https://purge.jsdelivr.net/${url#https://}"
            echo "Purging ${url}"

            response_file="$(mktemp)"
            status="$(curl --silent --show-error --location --output "${response_file}" --write-out "%{http_code}" "${purge_url}" || true)"

            echo "HTTP ${status}"
            cat "${response_file}"
            echo
            rm -f "${response_file}"
          done
